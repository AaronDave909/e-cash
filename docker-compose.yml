name: gcc-aiops-poc

# Stage 1:  docker compose up -d                    (5 app containers + datadog-agent)
#           docker compose up -d bills-pay wallet-transfer partner-gateway mock-jira fault-ui
#                                                    (Phase 1 smoke test, no DD_API_KEY needed)
# Stage 2:  docker compose --profile runner up -d    (adds the Private Action Runner once
#                                                    runner-config/config.yaml exists)

x-dd-app-env: &dd-app-env
  NODE_OPTIONS: "--require dd-trace/init"
  DD_ENV: gcc-poc
  DD_VERSION: 1.0.0
  DD_LOGS_INJECTION: "true"
  DD_TRACE_AGENT_URL: http://datadog-agent:8126
  DD_RUNTIME_METRICS_ENABLED: "true"

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  bills-pay:
    build:
      context: ./services
      dockerfile: bills-pay/Dockerfile
    image: gcc-aiops-poc/bills-pay:1.0.0
    environment:
      <<: *dd-app-env
      DD_SERVICE: bills-pay
      PORT: "8001"
      PARTNER_GATEWAY_URL: http://partner-gateway:8003
    labels:
      com.datadoghq.tags.service: bills-pay
      com.datadoghq.tags.env: gcc-poc
      com.datadoghq.tags.version: 1.0.0
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "bills-pay"}]'
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "NODE_OPTIONS= node -e \"fetch('http://localhost:8001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
    restart: unless-stopped

  wallet-transfer:
    build:
      context: ./services
      dockerfile: wallet-transfer/Dockerfile
    image: gcc-aiops-poc/wallet-transfer:1.0.0
    environment:
      <<: *dd-app-env
      DD_SERVICE: wallet-transfer
      PORT: "8002"
      PARTNER_GATEWAY_URL: http://partner-gateway:8003
    labels:
      com.datadoghq.tags.service: wallet-transfer
      com.datadoghq.tags.env: gcc-poc
      com.datadoghq.tags.version: 1.0.0
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "wallet-transfer"}]'
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "NODE_OPTIONS= node -e \"fetch('http://localhost:8002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
    restart: unless-stopped

  partner-gateway:
    build:
      context: ./services
      dockerfile: partner-gateway/Dockerfile
    image: gcc-aiops-poc/partner-gateway:1.0.0
    environment:
      <<: *dd-app-env
      DD_SERVICE: partner-gateway
      PORT: "8003"
    labels:
      com.datadoghq.tags.service: partner-gateway
      com.datadoghq.tags.env: gcc-poc
      com.datadoghq.tags.version: 1.0.0
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "partner-gateway"}]'
    # /health answers 503 in fault mode, so the container turns unhealthy during an outage:
    # one more black-box signal for Bits Investigation.
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "NODE_OPTIONS= node -e \"fetch('http://localhost:8003/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
    restart: unless-stopped

  mock-jira:
    build:
      context: ./services
      dockerfile: mock-jira/Dockerfile
    image: gcc-aiops-poc/mock-jira:1.0.0
    environment:
      PORT: "8004"
    labels:
      com.datadoghq.tags.service: mock-jira
      com.datadoghq.tags.env: gcc-poc
      com.datadoghq.tags.version: 1.0.0
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "mock-jira"}]'
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD-SHELL", "NODE_OPTIONS= node -e \"fetch('http://localhost:8004/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
    restart: unless-stopped

  fault-ui:
    build:
      context: ./fault-ui
      dockerfile: Dockerfile
    image: gcc-aiops-poc/fault-ui:1.0.0
    environment:
      PORT: "8080"
      BILLS_PAY_URL: http://bills-pay:8001
      WALLET_TRANSFER_URL: http://wallet-transfer:8002
      PARTNER_GATEWAY_URL: http://partner-gateway:8003
      MOCK_JIRA_URL: http://mock-jira:8004
    labels:
      com.datadoghq.tags.service: fault-ui
      com.datadoghq.tags.env: gcc-poc
      com.datadoghq.tags.version: 1.0.0
    # The only published port: in Codespaces everything goes through this one forwarded port.
    ports:
      - "8080:8080"
    depends_on:
      - bills-pay
      - wallet-transfer
      - partner-gateway
      - mock-jira
    restart: unless-stopped

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: gcc-poc
      DD_HOSTNAME: ${DD_HOSTNAME:-gcc-aiops-poc}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:datadog-agent name:dd-private-action-runner"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    restart: unless-stopped

  dd-private-action-runner:
    image: gcr.io/datadoghq/private-action-runner:latest
    profiles: ["runner"]
    environment:
      DD_PRIVATE_RUNNER_CONFIG_DIR: /etc/dd-action-runner/config
    # Enrollment writes runner-config/config.yaml (see README). The runner only dials out to
    # Datadog over HTTPS; workflows reach partner-gateway and mock-jira by service name.
    volumes:
      - ./runner-config:/etc/dd-action-runner/config
    restart: unless-stopped
